<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOKI QUEST // 勇者と精算の魔王城</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg-dark: #0f141c;
      --card-bg: #1a2230;
      --gold: #f59e0b;
      --gold-light: #fbbf24;
      --blue: #3b82f6;
      --green: #10b981;
      --red: #ef4444;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #374151;
      --border-gold: #d97706;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: var(--text);
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 10%, #1e293b 0%, #0a0e17 100%);
      padding: 16px;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 3px solid var(--border-gold);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7), 0 0 15px rgba(245, 158, 11, 0.2);
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 14px;
    }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-icon { font-size: 2rem; line-height: 1; }
    .logo-title {
      margin: 0;
      font-size: 1.15rem;
      color: var(--gold-light);
      font-weight: 900;
      letter-spacing: 1px;
    }
    .status-badge {
      background: var(--blue);
      color: white;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid #60a5fa;
      font-size: 0.72rem;
      font-weight: bold;
    }
    .status-badge.review { background: var(--gold); color: #111827; }

    /* RPG風 ステージ選択タブ（ロック機能付き） */
    .stage-tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-bottom: 14px;
    }
    @media (max-width: 480px) {
      .stage-tabs { grid-template-columns: repeat(3, 1fr); }
    }
    .stage-btn {
      padding: 8px 2px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: #111827;
      font-size: 0.7rem;
      font-weight: bold;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      line-height: 1.25;
      transition: all 0.2s ease;
    }
    .stage-btn.active {
      background: #92400e;
      color: white;
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }
    .stage-btn.locked {
      background: #0b0f17;
      color: #4b5563;
      border-color: #1f2937;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .quest-progress {
      margin-bottom: 16px;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .progress-track {
      height: 10px;
      width: 100%;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #10b981, #3b82f6);
      transition: width 0.3s ease;
    }
    .card {
      background: #0f172a;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      position: relative;
    }
    .question-label {
      display: inline-block;
      background: #d97706;
      color: white;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .story-text { margin: 0; font-size: 0.95rem; line-height: 1.65; }

    .split-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    @media(max-width: 560px) { .split-container { grid-template-columns: 1fr; } }
    .side-column {
      padding: 12px;
      background: #1e293b;
      border: 1px solid #3b82f6;
      border-radius: 10px;
    }
    .side-column.credit { border-color: #ef4444; }
    .side-title { text-align: center; margin-bottom: 8px; font-weight: bold; font-size: 0.85rem; }
    .entry-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .entry-row input {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      background: #0b0f17;
      color: white;
      width: 100%;
    }
    .entry-row input[type="text"] { flex: 1.3; }
    .entry-row input[type="number"] { flex: 1; }
    .btn-remove {
      background: #450a0a;
      border: 1px solid #991b1b;
      border-radius: 6px;
      color: #fca5a5;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-add {
      width: 100%;
      padding: 6px;
      background: #0f172a;
      border: 1px dashed var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(180deg, #d97706 0%, #b45309 100%);
      color: white;
      border: 1px solid var(--gold-light);
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(217, 119, 6, 0.4);
    }
    .btn-submit:hover { filter: brightness(1.1); }
    .result-box {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .result-box.correct { background: #064e3b; border: 1px solid #059669; color: #a7f3d0; }
    .result-box.wrong { background: #450a0a; border: 1px solid #dc2626; color: #fecaca; }
    .nav-buttons { display: flex; gap: 10px; margin-top: 14px; }
    .nav-btn {
      flex: 1;
      padding: 10px;
      background: #1f2937;
      color: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .clear-card { display: none; text-align: center; padding: 24px 16px; }
    .btn-next-stage, .btn-restart {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-next-stage { background: var(--green); color: white; border-color: #34d399; }
    .btn-restart { background: #374151; color: white; }

    details {
      margin-top: 20px;
      border-top: 1px dashed var(--border);
      padding-top: 14px;
    }
    summary { cursor: pointer; font-size: 0.8rem; color: var(--text-muted); font-weight: bold; }
    textarea {
      width: 100%;
      height: 90px;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0b0f17;
      color: white;
      font-family: monospace;
      font-size: 0.8rem;
    }
    .load-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .reset-link {
      display: block;
      margin-top: 18px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
    }

    /* 被ダメージ演出（画面ブルブル） */
    .shake-animation {
      animation: dmgShake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes dmgShake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
      40%, 60% { transform: translate3d(7px, 0, 0); }
    }

    /* 正解演出（下から舞い上がる魔法の光） */
    .rising-item {
      position: fixed;
      bottom: -30px;
      z-index: 9999;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: riseMagic ease-out forwards;
    }
    @keyframes riseMagic {
      0% { transform: translateY(0) scale(0.4) rotate(0deg); opacity: 0; }
      15% { opacity: 0.95; }
      50% { transform: translateY(-50vh) translateX(var(--drift, 20px)) scale(1.1) rotate(180deg); opacity: 0.9; }
      85% { opacity: 0.7; }
      100% { transform: translateY(-110vh) translateX(calc(var(--drift, 20px) * -1)) scale(1.3) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="container" id="mainContainer">
  <div class="header">
    <div class="logo-area">
      <div class="logo-icon">⚔️</div>
      <div>
        <h1 class="logo-title">BOKI QUEST</h1>
        <div style="font-size:0.7rem; color:var(--text-muted);" id="sub-title">〜 勇者と精算の魔王城 〜</div>
      </div>
    </div>
    <span class="status-badge" id="status-tag">🛡️ 冒険中</span>
  </div>

  <!-- ステージ選択（クリアでアンロック） -->
  <div class="stage-tabs">
    <button type="button" class="stage-btn active" id="tab-0" onclick="switchStage(0)">Lv.1<br>旅立ちの村</button>
    <button type="button" class="stage-btn locked" id="tab-1" onclick="switchStage(1)">Lv.2<br>🔒 迷いの森</button>
    <button type="button" class="stage-btn locked" id="tab-2" onclick="switchStage(2)">Lv.3<br>🔒 王都ギルド</button>
    <button type="button" class="stage-btn locked" id="tab-3" onclick="switchStage(3)">Lv.4<br>🔒 天空神殿</button>
    <button type="button" class="stage-btn locked" id="tab-4" onclick="switchStage(4)">Lv.5<br>🔒 決戦魔王城</button>
  </div>

  <div class="quest-progress">
    <div style="display:flex; justify-content:space-between; font-size:0.75rem; font-weight:bold;">
      <span id="stage-badge-text">📜 Lv.1 旅立ちの村・装備調達編</span>
      <span id="progress-text">第 1 問</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div id="quiz-area">
    <div class="card">
      <div class="question-label" id="q-number">QUEST // 01</div>
      <p class="story-text" id="story-display">読み込み中...</p>
    </div>

    <div class="split-container">
      <div class="side-column">
        <div class="side-title">⚔️ 借方 (Debit)</div>
        <div id="debit-rows"></div>
        <button type="button" class="btn-add" onclick="addRow('debit')">＋ 行を追加</button>
      </div>
      <div class="side-column credit">
        <div class="side-title">🛡️ 貸方 (Credit)</div>
        <div id="credit-rows"></div>
        <button type="button" class="btn-add" onclick="addRow('credit')">＋ 行を追加</button>
      </div>
    </div>

    <button type="button" class="btn-submit" id="submit-btn" onclick="checkAnswer()">詠唱して仕訳を発動する！</button>
    <div id="result-display" class="result-box"></div>

    <div class="nav-buttons">
      <button type="button" class="nav-btn" onclick="prevQuestion()">◀ 前の試練</button>
      <button type="button" class="nav-btn" id="next-btn" onclick="nextQuestion()">次の試練 ▶</button>
    </div>
  </div>

  <div id="clear-area" class="clear-card">
    <h2 style="color:var(--gold-light);" id="clear-heading">🎉 エリア踏破！</h2>
    <div id="complete-badge-area"></div>
    <p id="score-text" style="line-height:1.6; color:var(--text-muted);"></p>
    <div id="next-stage-btn-area"></div>
    <div id="review-btn-area"></div>
    <button type="button" class="btn-restart" onclick="startFreshStage()">このエリアを再挑戦する 🔄</button>
  </div>

  <details>
    <summary>📜 クエストの巻物を取り込む (JSON)</summary>
    <textarea id="json-input" placeholder="作成したJSON配列をここに貼り付けると、現在の章を上書きできます"></textarea>
    <button type="button" class="load-btn" onclick="loadCustomData()">クエストデータを更新</button>
  </details>

  <span class="reset-link" onclick="forceReset()">※ セーブデータを初期化して最初から冒険を始める</span>
</div>
<script>
const STAGES = [
  {
    title: "Lv.1 旅立ちの村・装備調達編",
    questions: [
      {
        "story": "【勇者の旅立ち】勇者は魔王討伐の旅を始めるにあたり、自身の貯金 100,000Gを元入れしてギルド口座（普通預金）を開設した。（普通預金）（資本金）",
        "debit": [{ "account": "普通預金", "amount": 100000 }],
        "credit": [{ "account": "資本金", "amount": 100000 }],
        "explanation": "事業活動の開始に伴う元入れは純資産（Net Assets）である「資本金（Capital）」の増加として貸方に計上し、資産（Asset）である「普通預金（Ordinary Deposit）」の増加を借方に記入します。"
      },
      {
        "story": "【武器の購入】村の鍛冶屋で冒険用の「鋼の剣」（備品）30,000Gを購入し、代金は普通預金口座から振り込んで支払った。（備品）（普通預金）",
        "debit": [{ "account": "備品", "amount": 30000 }],
        "credit": [{ "account": "普通預金", "amount": 30000 }],
        "explanation": "長期間使用する装備品は固定資産（Asset）である「備品（Equipment）」として借方に計上し、資産の「普通預金（Ordinary Deposit）」減少を貸方に記入します。"
      },
      {
        "story": "【防具の手付金】防具屋で特製の「白銀の鎧」80,000Gを注文し、内金（手付金）として現金 20,000Gを支払った。（前払金）（現金）",
        "debit": [{ "account": "前払金", "amount": 20000 }],
        "credit": [{ "account": "現金", "amount": 20000 }],
        "explanation": "商品の引渡し前に支払った手付金は資産（Asset）である「前払金（Advance Payments）」として借方に計上し、手許の資産「現金（Cash）」の減少を貸方に記入します。"
      },
      {
        "story": "【防具の納品と決済】白銀の鎧（備品）が仕立て上がり納品された。代金 80,000Gのうち、支払済みの手付金 20,000Gを充当し、残額 60,000Gは普通預金から支払った。（備品）（前払金）（普通預金）",
        "debit": [{ "account": "備品", "amount": 80000 }],
        "credit": [{ "account": "前払金", "amount": 20000 }, { "account": "普通預金", "amount": 60000 }],
        "explanation": "資産（Asset）である「備品（Equipment）」80,000Gの増加を借方に記入し、充当した「前払金（Advance Payments）」20,000Gおよび「普通預金（Ordinary Deposit）」の減少 60,000Gを貸方に記入する複合仕訳です。"
      },
      {
        "story": "【薬草の仕入】道中の回復用として、村の薬屋から「やくそう」（仕入）15,000G分を掛け（後払い）で仕入れた。（仕入）（買掛金）",
        "debit": [{ "account": "仕入", "amount": 15000 }],
        "credit": [{ "account": "買掛金", "amount": 15000 }],
        "explanation": "消費・売買を目的とした物資の調達は費用（Expense）である「仕入（Purchases）」を借方に記入し、後日支払う義務である負債（Liability）の「買掛金（Accounts Payable）」を貸方に記入します。"
      },
      {
        "story": "【宿屋への宿泊】旅立ちの前夜、体力を回復するため村の宿屋に宿泊し、宿泊代（旅費交通費）5,000Gを現金で支払った。（旅費交通費）（現金）",
        "debit": [{ "account": "旅費交通費", "amount": 5000 }],
        "credit": [{ "account": "現金", "amount": 5000 }],
        "explanation": "旅先での移動や宿泊にかかる費用（Expense）である「旅費交通費（Travel and Transportation Expense）」を借方に記入し、資産（Asset）の「現金（Cash）」減少を貸方に記入します。"
      },
      {
        "story": "【スライム退治の依頼料】村長からの依頼で村近くのスライムを退治し、成功報酬（売上）25,000Gを現金で受け取った。（現金）（売上）",
        "debit": [{ "account": "現金", "amount": 25000 }],
        "credit": [{ "account": "売上", "amount": 25000 }],
        "explanation": "本業の役務提供による対価は収益（Revenue）である「売上（Sales）」として貸方に記入し、資産（Asset）である「現金（Cash）」の増加を借方に記入します。"
      },
      {
        "story": "【ポーションの購入】緊急時の魔力回復薬（消耗品費）8,000Gを現金で購入した。（消耗品費）（現金）",
        "debit": [{ "account": "消耗品費", "amount": 8000 }],
        "credit": [{ "account": "現金", "amount": 8000 }],
        "explanation": "短期間で消費される消耗資材の費用（Expense）である「消耗品費（Supplies Expense）」を借方に記入し、資産（Asset）の「現金（Cash）」減少を貸方に記入します。"
      },
      {
        "story": "【薬屋へのツケ払い】先日掛けで仕入れた「やくそう」の代金 15,000Gを、現金で全額支払った。（買掛金）（現金）",
        "debit": [{ "account": "買掛金", "amount": 15000 }],
        "credit": [{ "account": "現金", "amount": 15000 }],
        "explanation": "負債（Liability）である「買掛金（Accounts Payable）」の消滅を借方に記入し、資産（Asset）である「現金（Cash）」の減少を貸方に記入します。"
      },
      {
        "story": "【安全のための預け入れ】手元に残った報奨金等の現金 20,000Gを、盗難防止のためギルドの普通預金口座へ預け入れた。（普通預金）（現金）",
        "debit": [{ "account": "普通預金", "amount": 20000 }],
        "credit": [{ "account": "現金", "amount": 20000 }],
        "explanation": "資産（Asset）である「普通預金（Ordinary Deposit）」の増加を借方に記入し、同じく手許資産である「現金（Cash）」の減少を貸方に記入します。"
      }
    ]
  },
  {
    title: "Lv.2 迷いの森・魔物討伐と素材売買編",
    questions: [
      {
        "story": "【魔物素材の掛け仕入】森の狩人から、討伐武器の素材となる「魔獣の牙と皮」（仕入）50,000G分を掛けで仕入れた。（仕入）（買掛金）",
        "debit": [{ "account": "仕入", "amount": 50000 }],
        "credit": [{ "account": "買掛金", "amount": 50000 }],
        "explanation": "営業取引に伴う費用（Expense）である「仕入（Purchases）」を借方に計上し、営業債務である負債（Liability）の「買掛金（Accounts Payable）」を貸方に記入します。"
      },
      {
        "story": "【装備の破損と修繕】ゴブリンの大群との戦闘で盾にヒビが入ったため、森の野営鍛冶屋に修理を依頼し、修繕費用（修繕費）12,000Gを現金で支払った。（修繕費）（現金）",
        "debit": [{ "account": "修繕費", "amount": 12000 }],
        "credit": [{ "account": "現金", "amount": 12000 }],
        "explanation": "既存装備の原状回復に伴う費用（Expense）である「修繕費（Repair Expense）」を借方に記入し、資産（Asset）の「現金（Cash）」減少を貸方に記入します。"
      },
      {
        "story": "【討伐素材の販売】討伐で入手した希少鉱石を旅の商人へ販売した。売上 90,000Gのうち、40,000Gは現金で受け取り、残額 50,000Gは掛け（売掛金）とした。（現金）（売掛金）（売上）",
        "debit": [{ "account": "現金", "amount": 40000 }, { "account": "売掛金", "amount": 50000 }],
        "credit": [{ "account": "売上", "amount": 90000 }],
        "explanation": "収益（Revenue）の「売上（Sales）」90,000Gを貸方に記入し、受領した資産（Asset）の「現金（Cash）」40,000Gと後日回収する権利である「売掛金（Accounts Receivable）」50,000Gをそれぞれ借方に計上する複合仕訳です。"

// ==================================================
// 進行制御システム（クリアで次のレベル解放）
// ==================================================
let currentStageIndex = 0;
let unlockedStageMax = 0;
let currentQuestions = [];
let currentIndex = 0;
let correctCount = 0;
let wrongList = [];
let answeredSet = new Set();
let isReviewMode = false;

function init() {
  const savedUnlocked = localStorage.getItem("boki_quest_unlocked_stage");
  unlockedStageMax = savedUnlocked ? parseInt(savedUnlocked, 10) : 0;
  if (isNaN(unlockedStageMax) || unlockedStageMax < 0) unlockedStageMax = 0;

  const savedStage = localStorage.getItem("boki_quest_current_stage");
  currentStageIndex = savedStage ? parseInt(savedStage, 10) : 0;
  if (currentStageIndex > unlockedStageMax) currentStageIndex = unlockedStageMax;

  updateTabLocks();
  loadStage(currentStageIndex);
}

function updateTabLocks() {
  for (let i = 0; i < STAGES.length; i++) {
    const btn = document.getElementById(`tab-${i}`);
    if (!btn) continue;

    if (i <= unlockedStageMax) {
      btn.classList.remove("locked");
      const titles = ["Lv.1<br>旅立ちの村", "Lv.2<br>迷いの森", "Lv.3<br>王都ギルド", "Lv.4<br>天空神殿", "Lv.5<br>決戦魔王城"];
      btn.innerHTML = titles[i];
    } else {
      btn.classList.add("locked");
      const lockedTitles = ["Lv.1<br>旅立ちの村", "Lv.2<br>🔒 迷いの森", "Lv.3<br>🔒 王都ギルド", "Lv.4<br>🔒 天空神殿", "Lv.5<br>🔒 決戦魔王城"];
      btn.innerHTML = lockedTitles[i];
    }
  }
}

function switchStage(stageIdx) {
  if (stageIdx > unlockedStageMax) {
    alert("🛡️ まだこのエリアへは進めません！\n前のステージを踏破してロックを解除してください。");
    return;
  }
  if (stageIdx === currentStageIndex && !isReviewMode) return;
  loadStage(stageIdx);
}

function loadStage(stageIdx) {
  currentStageIndex = stageIdx;
  localStorage.setItem("boki_quest_current_stage", currentStageIndex);

  for (let i = 0; i < STAGES.length; i++) {
    const btn = document.getElementById(`tab-${i}`);
    if (btn) {
      if (i === stageIdx) btn.classList.add("active");
      else btn.classList.remove("active");
    }
  }

  const stageObj = STAGES[stageIdx];
  document.getElementById("stage-badge-text").textContent = `📜 ${stageObj.title}`;
  document.getElementById("sub-title").textContent = `〜 ${stageObj.title} 〜`;

  const keyPrefix = `boki_quest_st${stageIdx}_`;
  let stageData = stageObj.questions;
  try {
    const customData = localStorage.getItem(`${keyPrefix}data`);
    if (customData) {
      const parsed = JSON.parse(customData);
      if (Array.isArray(parsed) && parsed.length > 0) stageData = parsed;
    }
  } catch(e) {}

  currentQuestions = [...stageData];
  currentIndex = 0;
  correctCount = 0;
  wrongList = [];
  isReviewMode = false;
  answeredSet.clear();

  document.getElementById("quiz-area").style.display = "block";
  document.getElementById("clear-area").style.display = "none";
  loadQuestion(0);
}

function createRowHTML(account = "", amount = "") {
  const div = document.createElement("div");
  div.className = "entry-row";
  div.innerHTML = `
    <input type="text" placeholder="勘定科目" value="${account}">
    <input type="number" placeholder="ゴールド(G)" value="${amount}">
    <button type="button" class="btn-remove" onclick="removeRow(this)">✕</button>
  `;
  return div;
}

function addRow(side) {
  const container = document.getElementById(`${side}-rows`);
  if (container) container.appendChild(createRowHTML());
}

function removeRow(btn) {
  const row = btn.closest(".entry-row");
  if (row && row.parentElement && row.parentElement.children.length > 1) {
    row.remove();
  } else {
    alert("最低1行は必要です。");
  }
}

function loadQuestion(index) {
  if (!currentQuestions || currentQuestions.length === 0) return;
  if (index < 0 || index >= currentQuestions.length) index = 0;
  currentIndex = index;

  const tag = document.getElementById("status-tag");
  if (isReviewMode) {
    tag.textContent = "🔄 試練の再演";
    tag.className = "status-badge review";
  } else {
    tag.textContent = (currentStageIndex === 4) ? "⚔️ 決戦中！" : "🛡️ 冒険中";
    tag.className = "status-badge";
  }

  const prefix = isReviewMode ? "🔄 復習" : `QUEST ${currentStageIndex + 1}`;
  document.getElementById("q-number").textContent = `${prefix} // ${index + 1} / ${currentQuestions.length}`;
  document.getElementById("story-display").textContent = currentQuestions[index].story;

  document.getElementById("debit-rows").innerHTML = "";
  document.getElementById("credit-rows").innerHTML = "";
  addRow("debit");
  addRow("credit");

  const res = document.getElementById("result-display");
  res.style.display = "none";
  res.className = "result-box";
  document.getElementById("submit-btn").style.display = "block";

  const nextBtn = document.getElementById("next-btn");
  nextBtn.textContent = (currentIndex === currentQuestions.length - 1) ? "決算報告へ 📜" : "次の試練 ▶";

  const percent = Math.round(((index + 1) / currentQuestions.length) * 100);
  document.getElementById("progress-fill").style.width = percent + "%";
  document.getElementById("progress-text").textContent = `${index + 1} / ${currentQuestions.length} 幕 (${percent}%)`;
}

function getEntries(side) {
  const container = document.getElementById(`${side}-rows`);
  if (!container) return [];
  const rows = container.children;
  const entries = [];
  for (let row of rows) {
    const inputs = row.querySelectorAll("input");
    if (inputs.length >= 2) {
      const account = inputs[0].value.trim();
      const amount = parseInt(inputs[1].value, 10);
      if (account && !isNaN(amount)) entries.push({ account, amount });
    }
  }
  return entries;
}

// 正解時：ゴールドや剣・宝箱が舞い上がる演出
function spawnRisingMagic() {
  const symbols = ["✨", "⚔️", "🛡️", "🪙", "💎", "👑", "📜"];
  const totalItems = 28;

  for (let i = 0; i < totalItems; i++) {
    const item = document.createElement("div");
    item.className = "rising-item";
    item.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    item.style.left = (Math.random() * 92 + 4) + "vw";
    
    const driftX = (Math.random() * 80 - 40) + "px";
    item.style.setProperty("--drift", driftX);

    const size = Math.random() * 16 + 20;
    const duration = Math.random() * 1.5 + 2.0;
    const delay = Math.random() * 0.4;

    item.style.fontSize = size + "px";
    item.style.animationDuration = duration + "s";
    item.style.animationDelay = delay + "s";

    document.body.appendChild(item);

    setTimeout(() => {
      item.remove();
    }, (duration + delay) * 1000);
  }
}

// 不正解時：痛恨の被ダメージ揺れ
function triggerShake() {
  const container = document.getElementById("mainContainer");
  container.classList.remove("shake-animation");
  void container.offsetWidth;
  container.classList.add("shake-animation");

  setTimeout(() => {
    container.classList.remove("shake-animation");
  }, 500);
}

function checkAnswer() {
  const q = currentQuestions[currentIndex];
  const userDebit = getEntries("debit");
  const userCredit = getEntries("credit");

  const normalize = d => Array.isArray(d) ? d : [d];
  const cDebit = normalize(q.debit);
  const cCredit = normalize(q.credit);

  const matchSide = (u, c) => {
    if (u.length !== c.length) return false;
    const sU = [...u].sort((a,b) => a.account.localeCompare(b.account) || a.amount - b.amount);
    const sC = [...c].sort((a,b) => a.account.localeCompare(b.account) || a.amount - b.amount);
    return sU.every((v, i) => v.account === sC[i].account && v.amount === sC[i].amount);
  };

  const isOk = matchSide(userDebit, cDebit) && matchSide(userCredit, cCredit);
  const res = document.getElementById("result-display");
  res.style.display = "block";

  if (isOk) {
    spawnRisingMagic();
    res.className = "result-box correct";
    res.innerHTML = `<strong>⚔️ 会心の一撃！（大正解）</strong><br>${q.explanation}`;
    if (!answeredSet.has(currentIndex)) {
      correctCount++;
      if (isReviewMode) wrongList = wrongList.filter(item => item.story !== q.story);
      answeredSet.add(currentIndex);
    }
  } else {
    triggerShake();
    res.className = "result-box wrong";
    const dStr = cDebit.map(d => `(${d.account}: ${d.amount.toLocaleString()}G)`).join(" ");
    const cStr = cCredit.map(c => `(${c.account}: ${c.amount.toLocaleString()}G)`).join(" ");
    res.innerHTML = `<strong>🛡️ 痛恨のミス！（不正解）</strong><br>借方: ${dStr}<br>貸方: ${cStr}<br><br>${q.explanation}`;
    if (!answeredSet.has(currentIndex)) {
      if (!wrongList.some(item => item.story === q.story)) wrongList.push(q);
      answeredSet.add(currentIndex);
    }
  }
}

function prevQuestion() { if (currentIndex > 0) loadQuestion(currentIndex - 1); }
function nextQuestion() {
  if (currentIndex < currentQuestions.length - 1) loadQuestion(currentIndex + 1);
  else showClearScreen();
}

function showClearScreen() {
  document.getElementById("quiz-area").style.display = "none";
  const clearArea = document.getElementById("clear-area");
  clearArea.style.display = "block";

  const total = currentQuestions.length;
  const badgeArea = document.getElementById("complete-badge-area");
  const scoreText = document.getElementById("score-text");
  const revArea = document.getElementById("review-btn-area");
  const nextArea = document.getElementById("next-stage-btn-area");

  badgeArea.innerHTML = "";
  revArea.innerHTML = "";
  nextArea.innerHTML = "";

  // ステージクリアにより次のステージをアンロック
  if (currentStageIndex === unlockedStageMax && unlockedStageMax < STAGES.length - 1) {
    unlockedStageMax++;
    localStorage.setItem("boki_quest_unlocked_stage", unlockedStageMax);
    updateTabLocks();
  }

  if (wrongList.length === 0) {
    spawnRisingMagic();
    badgeArea.innerHTML = `<div style="display:inline-block; padding:8px 16px; background:#064e3b; border:1px solid #059669; border-radius:8px; font-weight:bold; color:#6ee7b7; margin-bottom:12px;">🏆 完全踏破（パーフェクト）！</div>`;
    scoreText.innerHTML = `すべての試練を突破しました！ (${total}/${total})`;
  } else {
    scoreText.innerHTML = `${total} 問中 ${correctCount} 問 正解。<br>未討伐の誤答が ${wrongList.length} 問 あります。`;
    const revBtn = document.createElement("button");
    revBtn.className = "btn-restart";
    revBtn.style.background = "#92400e";
    revBtn.style.borderColor = "#f59e0b";
    revBtn.textContent = `🔄 間違えた試練だけ再戦する (${wrongList.length}問)`;
    revBtn.onclick = () => {
      isReviewMode = true;
      currentQuestions = [...wrongList];
      currentIndex = 0;
      correctCount = 0;
      answeredSet.clear();
      document.getElementById("quiz-area").style.display = "block";
      clearArea.style.display = "none";
      loadQuestion(0);
    };
    revArea.appendChild(revBtn);
  }

  // 次のステージへ進むボタン（次のステージが解放されている場合）
  if (currentStageIndex < STAGES.length - 1 && currentStageIndex < unlockedStageMax) {
    const nextBtn = document.createElement("button");
    nextBtn.className = "btn-next-stage";
    nextBtn.textContent = `⚔️ 次のエリア（Lv.${currentStageIndex + 2}）へ進む ▶`;
    nextBtn.onclick = () => {
      switchStage(currentStageIndex + 1);
    };
    nextArea.appendChild(nextBtn);
  } else if (currentStageIndex === 4 && wrongList.length === 0) {
    document.getElementById("clear-heading").textContent = "👑 世界に平和が訪れた！魔王討伐完了！";
  }
}

function startFreshStage() {
  loadStage(currentStageIndex);
}

function forceReset() {
  if (confirm("セーブデータを消去し、Lv.1から冒険をやり直しますか？")) {
    localStorage.removeItem("boki_quest_unlocked_stage");
    localStorage.removeItem("boki_quest_current_stage");
    location.reload();
  }
}

function loadCustomData() {
  const input = document.getElementById("json-input").value.trim();
  if (!input) {
    alert("巻物データ（JSON）を入力してください。");
    return;
  }
  try {
    const data = JSON.parse(input);
    if (!Array.isArray(data) || data.length === 0) throw new Error();

    STAGES[currentStageIndex].questions = data;
    localStorage.setItem(`boki_quest_st${currentStageIndex}_data`, JSON.stringify(data));
    loadStage(currentStageIndex);
    alert(`Lv.${currentStageIndex + 1} の試練データ（全${data.length}問）を更新しました！`);
  } catch (e) {
    alert("⚠️ JSONの構文を確認してください。正しく入力されている必要があります。");
  }
}

window.addEventListener("DOMContentLoaded", init);
</script>
